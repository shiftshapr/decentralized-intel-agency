# decentralizedintel.agency — HTTPS static site + /api proxy to Express :4013
#
# IMPORTANT: Do not install until the SSL cert exists, or nginx -t will fail.
# Use decentralizedintel.agency.http-only.conf first, then certbot, then this file.
#
# Apply:
#   sudo bash /home/ubuntu/decentralizedintel-agency/deploy/scripts/apply-nginx-and-tls.sh

server {
    listen 80;
    listen [::]:80;
    listen 216.238.91.120:80;
    server_name decentralizedintel.agency www.decentralizedintel.agency;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # Do NOT listen 216.238.91.120:443 — separate TLS socket breaks SNI for other vhosts.
    http2 on;
    server_name decentralizedintel.agency www.decentralizedintel.agency;

    ssl_certificate     /etc/letsencrypt/live/decentralizedintel.agency/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/decentralizedintel.agency/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /home/ubuntu/decentralizedintel-agency/public;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://127.0.0.1:4013;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
