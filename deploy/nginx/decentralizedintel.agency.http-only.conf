# decentralizedintel.agency — DIA static site (public/) + Express /api on 4013
# NOT Canopi — do not proxy to 3002/4000 here.
#
# Apply:
#   sudo bash /home/ubuntu/decentralizedintel-agency/deploy/scripts/apply-nginx-and-tls.sh

server {
    listen 80;
    listen [::]:80;
    # Required: ip-preview-themetalayer binds 216.238.91.120:80 and steals Host-based
    # vhosts without an explicit listen on the public IP (see moltlayer.io.conf).
    listen 216.238.91.120:80;
    server_name decentralizedintel.agency www.decentralizedintel.agency;

    root /home/ubuntu/decentralizedintel-agency/public;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4013;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
